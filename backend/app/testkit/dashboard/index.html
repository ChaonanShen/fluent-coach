<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>XEngineer Bench Dashboard</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f6f7f9;
      --panel: #ffffff;
      --line: #d9dde5;
      --text: #1f2328;
      --muted: #68707d;
      --accent: #0f766e;
      --accent-2: #2563eb;
      --danger: #b42318;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 14px;
      letter-spacing: 0;
    }

    header {
      border-bottom: 1px solid var(--line);
      background: var(--panel);
    }

    .bar {
      max-width: 1440px;
      margin: 0 auto;
      padding: 14px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    h1 {
      margin: 0;
      font-size: 18px;
      line-height: 1.2;
      font-weight: 700;
    }

    .meta {
      color: var(--muted);
      font-size: 12px;
      white-space: nowrap;
    }

    main {
      max-width: 1440px;
      margin: 0 auto;
      padding: 18px 20px 28px;
      display: grid;
      grid-template-columns: minmax(220px, 280px) minmax(0, 1fr);
      gap: 16px;
    }

    aside,
    section {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      min-width: 0;
    }

    aside {
      align-self: start;
      overflow: hidden;
    }

    .section-head {
      padding: 12px 14px;
      border-bottom: 1px solid var(--line);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    h2 {
      margin: 0;
      font-size: 14px;
      font-weight: 700;
    }

    button {
      border: 1px solid var(--line);
      background: #fff;
      color: var(--text);
      border-radius: 6px;
      min-height: 32px;
      padding: 0 10px;
      font: inherit;
      cursor: pointer;
    }

    button:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    .run-list {
      display: grid;
    }

    .run-item {
      width: 100%;
      min-height: 58px;
      border: 0;
      border-bottom: 1px solid var(--line);
      border-radius: 0;
      text-align: left;
      padding: 10px 12px;
      background: #fff;
    }

    .run-item.active {
      border-left: 4px solid var(--accent);
      padding-left: 8px;
      background: #eef8f6;
    }

    .run-id {
      display: block;
      font-weight: 650;
      overflow-wrap: anywhere;
      line-height: 1.25;
    }

    .run-sub {
      display: block;
      color: var(--muted);
      font-size: 12px;
      margin-top: 4px;
    }

    .content {
      display: grid;
      gap: 16px;
      min-width: 0;
    }

    .summary-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 1px;
      background: var(--line);
      border-bottom: 1px solid var(--line);
    }

    .summary-cell {
      background: #fff;
      padding: 12px 14px;
      min-width: 0;
    }

    .label {
      color: var(--muted);
      display: block;
      font-size: 12px;
      margin-bottom: 5px;
    }

    .value {
      font-weight: 700;
      overflow-wrap: anywhere;
    }

    .panel-body {
      padding: 14px;
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
    }

    th,
    td {
      border-bottom: 1px solid var(--line);
      padding: 9px 8px;
      text-align: left;
      vertical-align: top;
      line-height: 1.35;
      overflow-wrap: anywhere;
    }

    th {
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
      background: #fafbfc;
    }

    tr:last-child td {
      border-bottom: 0;
    }

    .latency-chart {
      width: 100%;
      min-height: 160px;
      margin-bottom: 14px;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      min-height: 22px;
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 0 8px;
      color: var(--muted);
      font-size: 12px;
      margin: 0 4px 4px 0;
      white-space: nowrap;
    }

    .turn-cards {
      display: grid;
      gap: 12px;
    }

    .turn-card {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      overflow: hidden;
    }

    .turn-card-head {
      padding: 10px 12px;
      border-bottom: 1px solid var(--line);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      background: #fafbfc;
    }

    .turn-title {
      font-weight: 700;
    }

    .turn-metrics {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 4px;
    }

    .exchange {
      padding: 12px;
      display: grid;
      gap: 10px;
    }

    .speaker-row {
      display: grid;
      gap: 5px;
      min-width: 0;
    }

    .speaker-row.interviewer {
      justify-items: start;
    }

    .speaker-row.candidate {
      justify-items: end;
    }

    .speaker-row.analysis {
      justify-items: start;
      border-top: 1px solid var(--line);
      padding-top: 10px;
    }

    .speaker-label {
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .bubble {
      max-width: min(760px, 100%);
      width: fit-content;
      padding: 10px 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      line-height: 1.45;
      overflow-wrap: anywhere;
      background: #fff;
    }

    .interviewer .bubble {
      background: #eff6ff;
      border-color: #bfdbfe;
    }

    .candidate .bubble {
      background: #f0fdfa;
      border-color: #99f6e4;
    }

    .analysis .bubble {
      background: #fff7ed;
      border-color: #fed7aa;
    }

    .subline {
      max-width: min(760px, 100%);
      color: var(--muted);
      font-size: 12px;
      line-height: 1.4;
      overflow-wrap: anywhere;
    }

    .turn-audio {
      width: 220px;
      max-width: 100%;
    }

    .error {
      color: var(--danger);
    }

    audio {
      width: 180px;
      max-width: 100%;
      height: 32px;
    }

    .empty {
      color: var(--muted);
      padding: 16px 14px;
    }

    @media (max-width: 900px) {
      main {
        grid-template-columns: 1fr;
      }

      .summary-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width: 560px) {
      .bar {
        align-items: flex-start;
        flex-direction: column;
      }

      .meta {
        white-space: normal;
      }

      .summary-grid {
        grid-template-columns: 1fr;
      }

      .turn-card-head {
        align-items: flex-start;
        flex-direction: column;
      }

      .turn-metrics {
        justify-content: flex-start;
      }

      .speaker-row.candidate {
        justify-items: start;
      }

      th,
      td {
        min-width: 120px;
      }
    }
  </style>
</head>
<body>
  <header>
    <div class="bar">
      <h1>XEngineer Bench Dashboard</h1>
      <div class="meta" id="status">Loading</div>
    </div>
  </header>
  <main>
    <aside>
      <div class="section-head">
        <h2>Runs</h2>
        <button id="refresh" type="button">Refresh</button>
      </div>
      <div id="runs" class="run-list"></div>
    </aside>
    <div class="content">
      <section>
        <div class="section-head">
          <h2>Summary</h2>
        </div>
        <div id="summary" class="empty">No run selected.</div>
      </section>
      <section>
        <div class="section-head">
          <h2>Latency</h2>
        </div>
        <div id="latency" class="panel-body"></div>
      </section>
      <section>
        <div class="section-head">
          <h2>Turns</h2>
        </div>
        <div id="turns" class="panel-body"></div>
      </section>
    </div>
  </main>
  <script>
    const state = { runs: [], selectedRunId: null };
    const el = (id) => document.getElementById(id);

    el("refresh").addEventListener("click", () => loadRuns());
    loadRuns();

    async function loadRuns() {
      setStatus("Loading");
      const response = await fetch("/api/runs");
      state.runs = response.ok ? await response.json() : [];
      renderRunList();
      if (state.runs.length === 0) {
        setStatus("No runs");
        renderEmpty();
        return;
      }
      const nextId = state.selectedRunId || state.runs[0].run_id;
      await loadRun(nextId);
    }

    function renderRunList() {
      el("runs").innerHTML = state.runs.map((run) => `
        <button class="run-item ${run.run_id === state.selectedRunId ? "active" : ""}" data-run-id="${escapeAttr(run.run_id)}" type="button">
          <span class="run-id">${escapeHtml(run.run_id)}</span>
          <span class="run-sub">${escapeHtml(run.scenario_id)} · ${escapeHtml(run.mode)} · ${run.turn_count} turns</span>
        </button>
      `).join("") || '<div class="empty">No runs found.</div>';
      document.querySelectorAll(".run-item").forEach((button) => {
        button.addEventListener("click", () => loadRun(button.dataset.runId));
      });
    }

    async function loadRun(runId) {
      state.selectedRunId = runId;
      renderRunList();
      const response = await fetch(`/api/runs/${encodeURIComponent(runId)}`);
      if (!response.ok) {
        setStatus("Run unavailable");
        renderEmpty();
        return;
      }
      const run = await response.json();
      setStatus(`${run.run_id} · ${run.turns.length} turns`);
      renderSummary(run);
      renderLatency(run);
      renderTurns(run);
    }

    function renderSummary(run) {
      const providers = Object.entries(run.providers || {}).map(([key, value]) => `${key}: ${value || "none"}`).join(" · ");
      const grammar = grammarSummary(run.turns || []);
      el("summary").className = "summary-grid";
      el("summary").innerHTML = `
        ${summaryCell("Run", run.run_id)}
        ${summaryCell("Scenario", run.scenario_id)}
        ${summaryCell("Mode", run.mode)}
        ${summaryCell("Generated", run.generated_at)}
        ${summaryCell("Turns", String(run.turns.length))}
        ${summaryCell("Providers", providers || "none")}
        ${summaryCell("Median TTFT", formatStat(run.latency_summary, "reply_first_delta_ms", "p50"))}
        ${summaryCell("Median ITL", formatStat(run.latency_summary, "reply_itl_ms", "p50"))}
        ${summaryCell("Median TTS", formatStat(run.latency_summary, "tts_ms", "p50"))}
        ${summaryCell("Avg Grammar Recall", grammar.recall == null ? "" : grammar.recall.toFixed(4))}
        ${summaryCell("Corrected Match", grammar.matchRate == null ? "" : grammar.matchRate.toFixed(4))}
      `;
    }

    function summaryCell(label, value) {
      return `<div class="summary-cell"><span class="label">${escapeHtml(label)}</span><span class="value">${escapeHtml(value || "")}</span></div>`;
    }

    function renderLatency(run) {
      const entries = Object.entries(run.latency_summary || {});
      if (entries.length === 0) {
        el("latency").innerHTML = '<div class="empty">No latency samples.</div>';
        return;
      }
      el("latency").innerHTML = renderLatencyChart(entries) + `
        <table>
          <thead><tr><th>Segment</th><th>p50</th><th>p90</th><th>p95</th><th>Max</th><th>Mean</th><th>Count</th></tr></thead>
          <tbody>
            ${entries.map(([key, stat]) => `
              <tr>
                <td><strong>${escapeHtml(key)}</strong></td>
                <td>${ms(stat.p50)}</td>
                <td>${ms(stat.p90)}</td>
                <td>${ms(stat.p95)}</td>
                <td>${ms(stat.max)}</td>
                <td>${ms(stat.mean)}</td>
                <td>${stat.count}</td>
              </tr>
            `).join("")}
          </tbody>
        </table>
      `;
    }

    function renderLatencyChart(entries) {
      const rows = entries.filter(([key]) => ["tts_ms", "asr_ms", "reply_first_delta_ms", "reply_itl_ms", "dialogue_reply_ms", "grammar_ms", "pronunciation_ms"].includes(key));
      if (rows.length === 0) return "";
      const max = Math.max(...rows.map(([, stat]) => stat.p95), 1);
      const width = 760;
      const rowHeight = 24;
      const height = rows.length * rowHeight + 24;
      const bars = rows.map(([key, stat], index) => {
        const y = 18 + index * rowHeight;
        const barWidth = Math.max(2, (stat.p95 / max) * 520);
        const color = key === "reply_first_delta_ms" || key === "reply_itl_ms" ? "var(--accent)" : "var(--accent-2)";
        return `
          <text x="0" y="${y + 12}" font-size="12" fill="#68707d">${escapeHtml(key)}</text>
          <rect x="190" y="${y}" width="${barWidth}" height="14" rx="3" fill="${color}"></rect>
          <text x="${200 + barWidth}" y="${y + 12}" font-size="12" fill="#1f2328">${ms(stat.p95)}</text>
        `;
      }).join("");
      return `<svg class="latency-chart" viewBox="0 0 ${width} ${height}" role="img">${bars}</svg>`;
    }

    function renderTurns(run) {
      if (!run.turns || run.turns.length === 0) {
        el("turns").innerHTML = '<div class="empty">No turns recorded.</div>';
        return;
      }
      el("turns").innerHTML = `
        <div class="turn-cards">
          ${run.turns.map((turn, index) => renderTurnCard(run, turn, index)).join("")}
          ${renderFinalInterviewerLine(run)}
        </div>
      `;
    }

    function renderTurnCard(run, turn, index) {
      const interviewerText = interviewerTextFor(run, index);
      const candidateText = turn.injected_text || turn.expected_text || turn.user_text || turn.asr_text || "";
      const correctedText = turn.grammar && turn.grammar.corrected_text || turn.expected_corrected_text || "";
      return `
        <article class="turn-card">
          <div class="turn-card-head">
            <div class="turn-title">Turn ${escapeHtml(turn.index)}</div>
            <div class="turn-metrics">
              ${turn.wer == null ? "" : `<span class="pill">WER ${Number(turn.wer).toFixed(4)}</span>`}
              ${timingPill("TTS", turn.timings_ms.tts_ms)}
              ${timingPill("ASR", turn.timings_ms.asr_ms)}
              ${timingPill("TTFT", turn.timings_ms.reply_first_delta_ms)}
              ${timingPill("Grammar", turn.timings_ms.grammar_ms)}
            </div>
          </div>
          <div class="exchange">
            <div class="speaker-row interviewer">
              <div class="speaker-label">面试官</div>
              <div class="bubble">${escapeHtml(interviewerText || "面试官开场白未记录。")}</div>
            </div>
            <div class="speaker-row candidate">
              <div class="speaker-label">
                <span>面试者</span>
                ${turn.audio_path ? `<audio class="turn-audio" controls src="/api/runs/${encodeURIComponent(run.run_id)}/turns/${index}/audio"></audio>` : ""}
              </div>
              <div class="bubble">${escapeHtml(candidateText)}</div>
              ${turn.asr_text ? `<div class="subline"><strong>ASR</strong> ${escapeHtml(turn.asr_text)}</div>` : ""}
              ${turn.clean_text ? `<div class="subline"><strong>Clean</strong> ${escapeHtml(turn.clean_text)}</div>` : ""}
            </div>
            ${correctedText || turn.grammar_metrics && Object.keys(turn.grammar_metrics).length ? `
              <div class="speaker-row analysis">
                <div class="speaker-label">
                  <span>语法纠错</span>
                  ${grammarMetricPills(turn)}
                </div>
                <div class="bubble">${escapeHtml(correctedText)}</div>
                ${grammarIssuePills(turn)}
              </div>
            ` : ""}
            ${formatPronunciation(turn.pronunciation) ? `
              <div class="speaker-row analysis">
                <div class="speaker-label">发音评测</div>
                <div>${formatPronunciation(turn.pronunciation)}</div>
              </div>
            ` : ""}
            ${formatErrors(turn.errors)}
          </div>
        </article>
      `;
    }

    function interviewerTextFor(run, index) {
      const turn = run.turns[index];
      if (turn && turn.interviewer_text) return turn.interviewer_text;
      if (index > 0 && run.turns[index - 1] && run.turns[index - 1].reply_text) {
        return run.turns[index - 1].reply_text;
      }
      return "";
    }

    function renderFinalInterviewerLine(run) {
      const turns = run.turns || [];
      if (turns.length === 0) return "";
      const last = turns[turns.length - 1];
      if (!last.reply_text) return "";
      return `
        <article class="turn-card">
          <div class="turn-card-head">
            <div class="turn-title">面试官后续追问</div>
          </div>
          <div class="exchange">
            <div class="speaker-row interviewer">
              <div class="speaker-label">面试官</div>
              <div class="bubble">${escapeHtml(last.reply_text)}</div>
            </div>
          </div>
        </article>
      `;
    }

    function grammarMetricPills(turn) {
      const metrics = turn.grammar_metrics || {};
      return `
        ${metrics.expected_error_recall == null ? "" : `<span class="pill">Recall ${Number(metrics.expected_error_recall).toFixed(4)}</span>`}
        ${metrics.corrected_text_match == null ? "" : `<span class="pill">Corrected ${metrics.corrected_text_match ? "match" : "diff"}</span>`}
      `;
    }

    function grammarIssuePills(turn) {
      const expected = turn.expected_error_types || [];
      const issues = turn.grammar && turn.grammar.issues ? turn.grammar.issues : [];
      const pills = [
        ...expected.map((type) => `<span class="pill">Expected ${escapeHtml(type)}</span>`),
        ...issues.map((issue) => `<span class="pill">${escapeHtml(issue.error_type || "issue")}</span>`),
      ];
      return pills.length ? `<div>${pills.join("")}</div>` : "";
    }

    function formatErrors(errors) {
      if (!errors || !errors.length) return "";
      return `
        <div class="speaker-row analysis">
          <div class="speaker-label">错误</div>
          ${errors.map((error) => `<div class="error">${escapeHtml(error.stage || "error")}: ${escapeHtml(error.code || error.user_message_zh || "")}</div>`).join("")}
        </div>
      `;
    }

    function line(label, value) {
      if (!value) return "";
      return `<div><span class="label">${escapeHtml(label)}</span>${escapeHtml(value)}</div>`;
    }

    function formatGrammar(turn) {
      const grammar = turn.grammar;
      const errors = turn.errors;
      if (errors && errors.length) {
        return errors.map((error) => `<div class="error">${escapeHtml(error.stage || "error")}: ${escapeHtml(error.code || error.user_message_zh || "")}</div>`).join("");
      }
      const expected = turn.expected_error_types || [];
      const metrics = turn.grammar_metrics || {};
      if (!grammar && expected.length === 0 && Object.keys(metrics).length === 0) return "";
      const issues = grammar && grammar.issues ? grammar.issues : [];
      return `
        ${expected.map((type) => `<span class="pill">Expected ${escapeHtml(type)}</span>`).join("")}
        <div>${escapeHtml(grammar && grammar.corrected_text || "")}</div>
        ${issues.map((issue) => `<span class="pill">${escapeHtml(issue.error_type || "issue")}</span>`).join("")}
        ${metrics.expected_error_recall == null ? "" : `<span class="pill">Recall ${Number(metrics.expected_error_recall).toFixed(4)}</span>`}
        ${metrics.corrected_text_match == null ? "" : `<span class="pill">Corrected ${metrics.corrected_text_match ? "match" : "diff"}</span>`}
      `;
    }

    function formatPronunciation(pronunciation) {
      if (!pronunciation) return "";
      return `
        <span class="pill">Overall ${number(pronunciation.overall)}</span>
        <span class="pill">Accuracy ${number(pronunciation.accuracy)}</span>
        <span class="pill">Fluency ${number(pronunciation.fluency)}</span>
      `;
    }

    function timingPill(label, value) {
      if (value == null) return "";
      return `<span class="pill">${escapeHtml(label)} ${ms(value)}</span>`;
    }

    function formatStat(summary, key, field) {
      const stat = summary && summary[key];
      return stat ? ms(stat[field]) : "";
    }

    function grammarSummary(turns) {
      const metricTurns = turns.filter((turn) => turn.grammar_metrics && Object.keys(turn.grammar_metrics).length);
      if (metricTurns.length === 0) return { recall: null, matchRate: null };
      const recalls = metricTurns
        .map((turn) => Number(turn.grammar_metrics.expected_error_recall))
        .filter((value) => Number.isFinite(value));
      const matches = metricTurns.map((turn) => turn.grammar_metrics.corrected_text_match === true ? 1 : 0);
      return {
        recall: recalls.length ? recalls.reduce((sum, value) => sum + value, 0) / recalls.length : null,
        matchRate: matches.length ? matches.reduce((sum, value) => sum + value, 0) / matches.length : null,
      };
    }

    function ms(value) {
      return `${Number(value).toFixed(1)} ms`;
    }

    function number(value) {
      return value == null ? "" : Number(value).toFixed(1);
    }

    function renderEmpty() {
      el("summary").className = "empty";
      el("summary").textContent = "No run selected.";
      el("latency").innerHTML = "";
      el("turns").innerHTML = "";
    }

    function setStatus(value) {
      el("status").textContent = value;
    }

    function escapeHtml(value) {
      return String(value == null ? "" : value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function escapeAttr(value) {
      return escapeHtml(value);
    }
  </script>
</body>
</html>
